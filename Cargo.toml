[package]
name = "rustcopycardapp"
version = "2.8.1"
edition = "2021"
description = "Camera card copy tool: sy mirror copy with XXH64 verification"
license = "MIT"
repository = "https://github.com/winddyx/rustCopyCardApp"
readme = "README.md"

[lib]
name = "rcca"
path = "src/lib.rs"

[[bin]]
name = "rcca"
path = "src/main.rs"

[dependencies]
sy = { path = "vendor/sy" }
tokio = { version = "1", features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
filetime = "0.2"
libc = "0.2"
terminal_size = "0.4"
thiserror = "2"
unicode-width = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Cross compiling for Linux has no system OpenSSL, so link a vendored one there.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
